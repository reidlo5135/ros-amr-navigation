amr_visualization:
  ros__parameters:
    enable_robot_model: true
    enable_robot_meshes: true
    enable_map_visualization: true
    enable_costmap_visualization: true
    enable_scan_visualization: true
    enable_tf_visualization: true
    robot_model_renderer_backend: opengl
    robot_opengl_force_visible: false
    robot_opengl_debug_camera: false
    robot_opengl_stl_only_debug: false
    robot_opengl_debug_mesh_bbox: false
    robot_opengl_debug_axes: false
    robot_opengl_debug_cube: false
    robot_opengl_verbose_diagnostics: false
    robot_opengl_auto_software_profile: true
    robot_opengl_target_fps: 0
    robot_opengl_software_target_fps: 8
    robot_opengl_hardware_target_fps: 30
    robot_model_emit_period_ms: 500
    tf_emit_period_ms: 200
    robot_model_pose_epsilon_m: 0.003
    robot_model_yaw_epsilon_rad: 0.003
    mesh_max_loaded_triangles: 200000
    mesh_max_file_size_mb: 32
    mesh_max_extent_m: 100.0
    mesh_max_abs_coordinate_m: 100.0