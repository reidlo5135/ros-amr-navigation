      trigger_global_localization: "/amr/localization/trigger_global_localization"
    frames:
      map: "map"
      odom: "odom"
      base: "base_link"
    start_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
    auto_initial_pose:
      enabled: false
      delay_sec: 3.0
      covariance:
        x: 0.25
        y: 0.25
        yaw: 0.06853891945200942
    amcl:
      particle_count: 200
      global_particle_count: 1200
      global_particle_sample_attempts: 1200
      initial_particle_std_xy: 0.15
      initial_particle_std_yaw: 0.15
      motion_noise_linear: 0.02
      motion_noise_lateral: 0.01
      motion_noise_angular: 0.05
      measurement_sigma: 0.15
      measurement_search_radius_cells: 4
      max_beams: 64
      max_beam_range: 6.0
      occupied_threshold: 50
      global_resample_position_noise: 0.025
      global_resample_yaw_noise: 0.06
      relocalization_max_position_std: 0.18
      relocalization_max_yaw_std: 0.35
      relocalization_min_cluster_weight: 0.22
      relocalization_min_cluster_dominance_ratio: 2.2
      estimate_cluster_distance: 0.30
      estimate_cluster_yaw: 0.60
      relocalization_candidate_lock_confidence_threshold: 0.12
      relocalization_candidate_lock_cluster_weight_threshold: 0.14
      relocalization_candidate_lock_distance: 0.90
      relocalization_candidate_lock_yaw: 1.00
      relocalization_candidate_lock_min_updates: 2
    kidnapped:
      enabled: true
      start_with_global_localization: true
      auto_trigger: false
      low_confidence_threshold: 0.22
      consecutive_low_confidence_updates: 6
      relocalization_success_threshold: 0.55
      relocalization_success_streak: 4
      relocalization_timeout_sec: 10.0

