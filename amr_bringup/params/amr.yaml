      allow_diagonal: false
      parallel_angle_tolerance_deg: 12.0
      min_wall_overlap_m: 0.80
      max_centerline_gap_m: 0.35
      min_free_ratio_between_walls: 0.75
      min_traversable_ratio_on_centerline: 0.80
      skeleton_enabled: true
      skeleton_min_width_variance_m: 0.30
      split_and_merge_angle_deg: 15.0
      min_aspect_ratio: 2.2
      min_free_ratio: 0.70
      min_boundary_evidence_ratio: 0.35
