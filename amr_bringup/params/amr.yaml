/amr/map_server:
  ros__parameters:
    frame_id: map
    publish_topic: map
    width: 20
    height: 20
    resolution: 0.25

/amr/localization:
  ros__parameters:
    odom_topic: localization/odom
    map_frame: map
    base_frame: base_link
    publish_period_ms: 100

/amr/global_planner:
  ros__parameters:
    map_topic: map
    computed_plan_topic: computed_plan
    plan_segment_service: plan_segment
    plan_route_service: plan_route
    obstacle_threshold: 50
    connectivity: 8
    allow_unknown: false
    simplify_path: true
    prevent_corner_cutting: true
    turn_penalty: 0.5

/amr/local_planner:
  ros__parameters:
    command_topic: motion_command
    status_topic: motion_status
    cmd_vel_topic: cmd_vel
    publish_period_ms: 100
    nominal_linear_velocity: 0.3

/amr/bt_navigator:
  ros__parameters:
    execute_route_action: execute_route
    command_topic: motion_command
    default_node_id: start
