/costmap_server:
  ros__parameters:
    frames:
      map: "map"
      odom: "odom"
      base: "base_footprint"
    tf:
      lookup_timeout_sec: 0.05
    topics:
      map: "/map"
      scan: "/scan"
      global: "/global_costmap"
      local: "/local_costmap"
    services:
      clear_costmap: "/clear_costmap"
    footprint:
      polygon:
        [
          -0.10, -0.09,
           0.10, -0.09,
           0.10,  0.09,
          -0.10,  0.09
        ]
      padding: 0.02
    inflation:
      obstacle_threshold: 50
      global:
        radius: 0.20
        cost: 80
      local:
        radius: 0.18
        cost: 90
    dynamic:
      max_distance: 1.8
      forward_angle_deg: 100.0
      static_clearance_cells: 4
    publish:
      global_on_scan: false
      local_min_period_ms: 100
    local_window:
      enabled: true
      radius: 2.5
    logging:
      structured_enabled: true

/navigation_manager:
  ros__parameters:
    autostart: true
    service_timeout_ms: 5000
    state_poll_interval_ms: 200
    initial_pose:
      enabled: false
    logging:
      structured_enabled: true

/global_planner:
  ros__parameters:
    footprint:
      polygon:
        [
          -0.10, -0.09,
           0.10, -0.09,
           0.10,  0.09,
          -0.10,  0.09
        ]
    topics:
      costmap: "/global_costmap"
      plan: "/global_plan"
    services:
      segment: "/plan_segment"
      route: "/plan_route"
    planner:
      obstacle_threshold: 50
      connectivity: 8
      allow_unknown: false
      simplify_path: false
      prevent_corner_cutting: true
      turn_penalty: 0.5
      start_row_hold_penalty: 1.25
      goal_row_align_distance_cells: 6
      goal_row_align_penalty: 1.75
      nearest_free_search_radius_cells: 4
      axis_aligned_straightening_enabled: true
      same_x_tolerance_m: 0.05
      same_column_tolerance_cells: 1
      axis_aligned_interpolation_distance: 0.10
      axis_aligned_require_line_of_sight: true
      same_row_straightening_enabled: true
      same_row_tolerance_cells: 1
      same_y_tolerance_m: 0.05
      same_row_max_lateral_deviation_cells: 1
      same_row_interpolation_distance: 0.10
      same_row_require_line_of_sight: true
    logging:
      structured_enabled: true

/local_planner:
  ros__parameters:
    frames:
      map: "map"
      odom: "odom"
      base: "base_footprint"
    tf:
      lookup_timeout_sec: 0.05
    footprint:
      polygon:
        [
          -0.10, -0.09,
           0.10, -0.09,
           0.10,  0.09,
          -0.10,  0.09
        ]
    topics:
      command: "/motion_command"
      costmap: "/local_costmap"
      global_plan: "/global_plan"
      plan: "/local_plan"
      status: "/local_plan_status"
    services:
      local_escape: "/plan_local_escape"
    planner:
      publish_period_ms: 100
      lookahead_distance: 0.55
      goal_tolerance: 0.15
      obstacle_threshold: 50
      connectivity: 8
      allow_unknown: false
      prevent_corner_cutting: true
      turn_penalty: 0.5
      nearest_free_search_radius_cells: 4
    path_refiner:
      enabled: true
      prune_distance: 0.03
      interpolate_distance: 0.15
      heading_assignment_enabled: true
      preserve_goal_orientation: false
      line_of_sight_simplification_enabled: true
      line_of_sight_sample_distance: 0.05
      line_of_sight_max_skip: 8
      collinear_pruning_enabled: true
      collinear_angle_threshold: 0.08
      collinear_lateral_deviation_threshold: 0.015
      corner_smoothing_enabled: true
      corner_smoothing_max_offset: 0.06
      corner_smoothing_angle_threshold: 0.50
      corner_smoothing_samples: 2
      smoothing_max_length_ratio: 1.08
      smoothing_max_pose_deviation: 0.04
      collision_check_enabled: true
      collision_sample_distance: 0.05
    local_path_guard:
      enabled: true
      min_points: 2
      min_length_m: 0.05
      fallback_min_points: 2
      fallback_lookahead_m: 0.20
      allow_single_point_when_goal_reached: true
      degenerate_log_throttle_sec: 1.0
    dynamic_obstacle:
      enabled: true
      replan_lookahead_distance: 1.2
      escape_forward_distance: 0.55
      escape_lateral_distance: 0.22
      goal_proximity_disable_distance: 0.45
      corridor_relax_distance: 0.75
      recovery_confirm_cycles: 3
      goal_proximity_confirm_cycles: 2
      corridor_confirm_cycles: 5
      clear_confirm_cycles: 2
    logging:
      structured_enabled: true
      state_log_throttle_sec: 1.0

/motion_controller:
  ros__parameters:
    frames:
      map: "map"
      odom: "odom"
      base: "base_footprint"
    tf:
      lookup_timeout_sec: 0.05
    topics:
      command: "/motion_command"
      plan: "/local_plan"
      scan: "/scan"
      status: "/motion_status"
      velocity: "/cmd_vel"
    control:
      frequency: 10.0
      linear_speed: 0.10
      min_linear_speed: 0.06
      tracking_lookahead_distance: 0.22
      straight_tracking_lookahead_distance: 0.45
      tracking_min_target_distance: 0.08
      tracking_progress_rollback_window: 2
      tracking_target_hysteresis_distance: 0.08
      tracking_target_reset_distance: 0.35
      angular_gain: 2.0
      max_angular_speed: 0.65
      distance_tolerance: 0.1
      goal_heading_tolerance: 0.12
      goal_reach_heading_tolerance: 0.08
      final_align_max_angular_speed: 0.35
      final_align_heading_deadband: 0.06
      final_align_settle_time_sec: 0.30
      tracking_heading_deadband: 0.06
      tracking_heading_release_threshold: 0.11
      straight_tracking_enabled: true
      straight_curvature_threshold: 0.12
      straight_lateral_error_threshold: 0.035
      straight_heading_deadband: 0.12
      straight_heading_release_threshold: 0.18
      straight_angular_gain: 0.75
      straight_max_angular_speed: 0.14
      straight_heading_filter_alpha: 0.20
      rejoin_target_distance_threshold: 0.12
      rejoin_context_timeout_sec: 2.5
      rejoin_context_distance_m: 0.45
      rejoin_target_jump_threshold_m: 0.28
      rejoin_heading_gate_threshold: 0.28
      rejoin_min_linear_scale: 0.25
      rotate_in_place_threshold: 0.55
      rotate_in_place_goal_distance: 0.16
      heading_slowdown_threshold: 0.16
      min_heading_motion_scale: 0.18
    regulated_pure_pursuit:
      enabled: true
      use_velocity_scaled_lookahead: true
      min_tracking_lookahead_distance: 0.20
      max_tracking_lookahead_distance: 0.80
      lookahead_time: 1.2
      use_curvature_speed_regulation: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.06
      use_approach_velocity_scaling: true
      approach_velocity_scaling_distance: 0.60
      min_approach_linear_speed: 0.05
      use_obstacle_velocity_scaling: true
      obstacle_velocity_scaling_distance: 0.45
      obstacle_velocity_scaling_min_speed: 0.05
      use_collision_projection: true
      collision_projection_time: 0.8
      collision_projection_step_distance: 0.05
    progress_checker:
      required_movement_radius: 0.03
      time_allowance_sec: 4.0
    status:
      command_settle_time_sec: 0.7
      blocked_confirm_cycles: 3
      blocked_clear_cycles: 3
      stalled_confirm_cycles: 2
    goal_checker:
      xy_tolerance: 0.1
      xy_hysteresis: 0.04
      yaw_tolerance: 0.7853981633974483
      hold_time_sec: 0.0
      respect_goal_yaw: false
      ignore_yaw: false
    safety_gate:
      enabled: true
      allow_rotate_in_place: true
      stop_distance: 0.22
      forward_angle_deg: 20.0
      rotate_heading_threshold: 0.20
      minimum_points: 3
    velocity_controller:
      mode: "pid"
      linear:
        kp: 0.35
        ki: 0.00
        kd: 0.04
        integral_limit: 0.20
      angular:
        kp: 0.45
        ki: 0.00
        kd: 0.00
        integral_limit: 0.30
      max_linear_accel: 0.10
      max_angular_accel: 0.8
    logging:
      structured_enabled: true
      tracking_state_throttle_sec: 1.0
      cmd_quality_throttle_sec: 1.0
      target_jump_warn_threshold_m: 0.28

/navigator:
  ros__parameters:
    frames:
      map: "map"
      odom: "odom"
      base: "base_footprint"
    tf:
      lookup_timeout_sec: 0.05
    behavior_tree:
      xml_path: ""
    topics:
      command: "/motion_command"
      status: "/motion_status"
      local_plan_status: "/local_plan_status"
    services:
      segment: "/plan_segment"
      plan_recovery: "/plan_recovery"
      local_escape: "/plan_local_escape"
      clear_costmap: "/clear_costmap"
    actions:
      navigate_to_pose: "/navigate_to_pose"
      navigate_to_poses: "/navigate_to_poses"
    defaults:
      node_id: "start"
    execution:
      planner_wait_timeout_ms: 2000
      feedback_period_ms: 100
      align_heading_at_goal: true
      nominal_linear_speed: 0.075
    recovery:
      max_retries: 4
      retry_delay_ms: 1000
      reacquire_settle_ms: 900
    logging:
      structured_enabled: true
      recovery_decision_logging: true

/recovery_server:
  ros__parameters:
    services:
      plan_recovery: "/plan_recovery"
    defaults:
      node_id: "recovery"
    recovery:
      wait_duration_sec: 1.2
      backup_distance: 0.18
      backup_speed: 0.05
      spin_angle_rad: 1.2217304763960306
    logging:
      structured_enabled: true

/runtime_observation:
  ros__parameters:
    topics:
      motion_command: "/motion_command"
      motion_status: "/motion_status"
      local_plan_status: "/local_plan_status"
      observation_summary: "/observation/runtime/summary"
      observation_events: "/observation/runtime/events"
    actions:
      navigate_to_poses: "/navigate_to_poses"
    observation:
      publish_period_ms: 200
      route_stale_timeout_ms: 1500
      progress_stall_window_sec: 3.0
      progress_epsilon: 0.05
      progress_clear_delta_m: 0.005
      goal_approach_distance: 0.14
      final_heading_alignment_distance: 0.08
    logging:
      structured_enabled: true
      summary_throttle_sec: 1.0
      heavy_topic_observation_enabled: false
