/amr/map_server:
  ros__parameters:
    files:
      yaml: "/home/reidlo/ws/data/maps/map_office_260310.yaml"
    mode:
      mapping: false
    frames:
      map: "map"
      odom: "odom"
    topics:
      map: "/amr/map/data"
      temporary_map: "/amr/map/temporary"
    services:
      get: "/amr/map_server/get_map"
      freeze: "/amr/map_server/freeze_temporary_map"
      evaluate: "/amr/map_server/evaluate_temporary_map"
      save: "/amr/map_server/save_temporary_map"
    mapping:
      topics:
        pose: "/odom"
        imu: "/imu"
        scan: "/scan"
      publish_period_ms: 500
      resolution: 0.05
      width: 400
      height: 400
      origin:
        x: -10.0
        y: -10.0
        yaw: 0.0
      range:
        min: 0.05
        max: 8.0
      publish_identity_tf: true
      save:
        directory: "/home/reidlo/ws/data/maps"
        basename: "amr_temporary_map"
      scan_matching:
        enabled: true
        linear_window: 0.15
        linear_step: 0.05
        angular_window_deg: 12.0
        angular_step_deg: 3.0
        max_beams: 32
        min_valid_beams: 8
        occupied_search_radius_cells: 1
        minimum_occupied_cells: 50
        occupied_match_score: 3.0
        free_space_penalty: 1.0
      occupancy:
        hit_score: 20
        free_score: 3
        decay_score: 1
        occupied_score_threshold: 20
        free_score_threshold: -5
        score_min: -20
        score_max: 100
      quality:
        min_known_ratio: 0.35
        min_free_ratio: 0.10
        min_occupied_ratio: 0.01
        inflation_radius_cells: 4
        min_inflated_free_ratio: 0.05
        require_corrected_pose: true
      auto_save:
        enabled: false
        required_consecutive_passes: 3

/amr/localization:
  ros__parameters:
    topics:
      odom: "/odom"
      scan: "/scan"
      map: "/amr/map/data"
      initial_pose: "/amr/localization/initial_pose"
      estimated_pose: "/amr/localization/pose"
      estimated_odometry: "/amr/localization/odometry"
    frames:
      map: "map"
      odom: "odom"
      base: "base_link"
    start_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
    auto_initial_pose:
      enabled: false
      delay_sec: 3.0
      covariance:
        x: 0.25
        y: 0.25
        yaw: 0.06853891945200942
    amcl:
      particle_count: 200
      initial_particle_std_xy: 0.15
      initial_particle_std_yaw: 0.15
      motion_noise_linear: 0.02
      motion_noise_lateral: 0.01
      motion_noise_angular: 0.05
      measurement_sigma: 0.15
      measurement_search_radius_cells: 4
      max_beams: 24
      max_beam_range: 6.0
      occupied_threshold: 50

/amr/localization_manager:
  ros__parameters:
    autostart: true
    service_timeout_ms: 5000
    state_poll_interval_ms: 200
    initial_pose:
      enabled: true
      topic: "/amr/localization/initial_pose"
      frame_id: "map"
      delay_sec: 0.5
      x: 0.0
      y: 0.0
      yaw: 0.0
      covariance:
        x: 0.25
        y: 0.25
        yaw: 0.06853891945200942

/amr/obstacle_detection:
  ros__parameters:
    topics:
      scan: "/scan"
      pose: "/amr/localization/pose"
      map: "/amr/map/data"
      report: "/amr/obstacle/report"
    detection:
      max_distance: 1.8
      forward_angle_deg: 100.0
      minimum_points: 3
      static_clearance_cells: 2
      blocking_distance: 1.2
      critical_distance: 0.25
      high_distance: 0.7
      medium_distance: 1.2
      obstacle_threshold: 50

/amr/costmap_server:
  ros__parameters:
    topics:
      map: "/amr/map/data"
      obstacle_report: "/amr/obstacle/report"
      global: "/amr/costmap/global"
      local: "/amr/costmap/local"
    inflation:
      obstacle_threshold: 50
      global:
        radius: 0.20
        cost: 80
      local:
        radius: 0.30
        cost: 100

/amr/navigation_manager:
  ros__parameters:
    autostart: true
    service_timeout_ms: 5000
    state_poll_interval_ms: 200
    initial_pose:
      enabled: false
      topic: "/amr/localization/initial_pose"
      frame_id: "map"
      delay_sec: 0.5
      x: 0.0
      y: 0.0
      yaw: 0.0
      covariance:
        x: 0.25
        y: 0.25
        yaw: 0.06853891945200942

/amr/global_planner:
  ros__parameters:
    topics:
      costmap: "/amr/costmap/global"
      plan: "/amr/planner/global"
    services:
      segment: "/amr/global_planner/plan_segment"
      route: "/amr/global_planner/plan_route"
    planner:
      obstacle_threshold: 50
      connectivity: 8
      allow_unknown: false
      simplify_path: false
      prevent_corner_cutting: true
      turn_penalty: 0.5
      nearest_free_search_radius_cells: 4

/amr/local_planner:
  ros__parameters:
    topics:
      command: "/amr/motion/command"
      pose: "/amr/localization/pose"
      costmap: "/amr/costmap/local"
      obstacle_report: "/amr/obstacle/report"
      plan: "/amr/planner/local"
    planner:
      publish_period_ms: 100
      lookahead_distance: 0.8
      goal_tolerance: 0.15
      obstacle_threshold: 50
      connectivity: 8
      allow_unknown: false
      prevent_corner_cutting: true
      turn_penalty: 0.5
      nearest_free_search_radius_cells: 4
    dynamic_obstacle:
      enabled: true
      replan_lookahead_distance: 2.0
      escape_forward_distance: 1.2
      escape_lateral_distance: 0.55

/amr/motion_controller:
  ros__parameters:
    topics:
      command: "/amr/motion/command"
      plan: "/amr/planner/local"
      pose: "/amr/localization/pose"
      scan: "/scan"
      status: "/amr/motion/status"
      velocity: "/cmd_vel"
    control:
      frequency: 10.0
      linear_speed: 0.075
      min_linear_speed: 0.05
      tracking_lookahead_distance: 0.25
      angular_gain: 2.0
      max_angular_speed: 0.65
      distance_tolerance: 0.1
      rotate_in_place_threshold: 0.6
      rotate_in_place_goal_distance: 0.35
      heading_slowdown_threshold: 0.2
      min_heading_motion_scale: 0.15
    safety_gate:
      enabled: true
      allow_rotate_in_place: true
      stop_distance: 0.3
      forward_angle_deg: 30.0
      rotate_heading_threshold: 0.20
      minimum_points: 3
    velocity_controller:
      mode: "pid"
      linear:
        kp: 0.35
        ki: 0.00
        kd: 0.04
        integral_limit: 0.20
      angular:
        kp: 0.45
        ki: 0.00
        kd: 0.02
        integral_limit: 0.30
      max_linear_accel: 0.09
      max_angular_accel: 0.8

/amr/navigator:
  ros__parameters:
    topics:
      pose: "/amr/localization/pose"
      command: "/amr/motion/command"
      status: "/amr/motion/status"
      obstacle_report: "/amr/obstacle/report"
    services:
      segment: "/amr/global_planner/plan_segment"
    actions:
      navigate_to_pose: "/amr/navigator/navigate_to_pose"
    defaults:
      node_id: "start"
    execution:
      planner_wait_timeout_ms: 2000
      feedback_period_ms: 100

/amr/rviz_bridge:
  ros__parameters:
    topics:
      goal_pose: "/amr/rviz/goal"
    actions:
      navigate_to_pose: "/amr/navigator/navigate_to_pose"
    execution:
      action_wait_timeout_ms: 1000
